<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2955" id="metaTheme">
<title>Repositorio UCA</title>
<meta name="description" content="Material de estudio colaborativo entre estudiantes de la UCA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E2955; --blue:#1D4ED8; --blue-d:#1E40AF; --amber:#F59E0B; --amber-bg:#FEF3C7; --amber-tx:#92400E;
  --bg:#F1F5F9; --surface:#FFFFFF; --surface2:#F8FAFC; --line:#E2E8F0; --text:#0F172A; --muted:#566782;
  --ok:#047857; --ok-bg:#ECFDF5; --bad:#BE123C; --bad-bg:#FFF1F2; --chip-bg:#EFF6FF; --chip-tx:#1D4ED8; --page:#CBD5E1;
  --t-resumen:#1D4ED8; --t-examen:#D97706; --t-guia:#059669; --t-apunte:#7C3AED;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 6px 16px rgba(15,23,42,.06);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1120; --surface:#131C31; --surface2:#182238; --line:#26324D; --text:#E5EAF5; --muted:#9AA8C2;
    --blue:#3B6EF0; --blue-d:#2F5BD0; --chip-bg:#1B2A4E; --chip-tx:#A9C4FF; --ok:#34D399; --ok-bg:#0E2A22;
    --bad:#FB7185; --bad-bg:#3A1620; --amber-bg:#3A2A0A; --amber-tx:#FCD34D; --page:#050810;
    --t-resumen:#6EA0FF; --t-examen:#FBBF24; --t-guia:#34D399; --t-apunte:#A78BFA;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#131C31; --surface2:#182238; --line:#26324D; --text:#E5EAF5; --muted:#9AA8C2;
  --blue:#3B6EF0; --blue-d:#2F5BD0; --chip-bg:#1B2A4E; --chip-tx:#A9C4FF; --ok:#34D399; --ok-bg:#0E2A22;
  --bad:#FB7185; --bad-bg:#3A1620; --amber-bg:#3A2A0A; --amber-tx:#FCD34D; --page:#050810;
  --t-resumen:#6EA0FF; --t-examen:#FBBF24; --t-guia:#34D399; --t-apunte:#A78BFA;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--page);color:var(--text);font:400 14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Poppins,Inter,system-ui,sans-serif;margin:0;line-height:1.25}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
.stage{height:100%;display:flex;justify-content:center}
.phone{width:100%;max-width:430px;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.18)}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pad{padding:16px}
.list{display:flex;flex-direction:column;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:12px}
.lead{color:var(--muted);font-size:15px;line-height:1.5}
.center{text-align:center}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:0}
.err:empty{display:none}
.link{color:var(--chip-tx);font-weight:600;text-decoration:none}

/* barra superior */
.appbar{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 6px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.appbar h2{font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none;flex-shrink:0}
.iconbtn:hover{background:var(--surface2)}
.iconbtn.sm{width:40px;height:40px}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:14px;text-decoration:none;transition:transform .1s,background .15s;text-align:center}
.btn:active{transform:scale(.98)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-d)}
.btn-soft{background:var(--chip-bg);color:var(--chip-tx)}
.btn-line{border:1px solid var(--line);background:var(--surface);color:var(--text)}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.btn-amber{background:var(--amber);color:#111827}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.iconbtn:focus-visible,.tab:focus-visible,.pill:focus-visible,.row:focus-visible,a:focus-visible,summary:focus-visible,.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--blue);outline-offset:2px}

/* formularios */
.field{display:block}
.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.input,.select,.textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:15px}
.textarea{min-height:92px;resize:vertical}
.form{display:flex;flex-direction:column;gap:14px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.check input{width:20px;height:20px;margin:1px 0 0;flex-shrink:0;accent-color:var(--blue)}
.pwrow{position:relative}
.pwrow .input{padding-right:84px}
.pwrow button{position:absolute;right:6px;top:3px;min-height:40px;padding:0 10px;font-weight:600;font-size:13px;color:var(--chip-tx)}

/* tarjetas y chips */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.doc{display:flex;flex-direction:column;gap:6px;border-left:5px solid var(--spine,var(--t-resumen))}
.t-resumen{--spine:var(--t-resumen)} .t-examen{--spine:var(--t-examen)} .t-guia{--spine:var(--t-guia)} .t-apunte{--spine:var(--t-apunte)}
.dtitle{font-weight:700;font-size:15px;line-height:1.3;text-decoration:none;font-family:Poppins,Inter,sans-serif}
.dsub{color:var(--chip-tx);font-weight:600;font-size:13px;text-decoration:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--chip-bg);color:var(--chip-tx);white-space:nowrap}
.chip.amber{background:var(--amber-bg);color:var(--amber-tx)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.pill{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;white-space:nowrap}
.pill[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding-top:10px;border-top:1px solid var(--line)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.avatar.lg{width:76px;height:76px;font-size:26px;font-family:Poppins,Inter,sans-serif}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.sec h3{font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats.s4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font:700 17px Poppins,Inter,sans-serif}
.stat span{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:12px;font-weight:600;border-bottom:4px solid var(--spine)}
.mini{flex:0 0 220px;display:flex;flex-direction:column;gap:4px;text-decoration:none;border-left:5px solid var(--spine,var(--t-resumen));padding:12px;background:var(--surface);border-radius:14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.mini b{font-size:13px;line-height:1.3;font-family:Poppins,Inter,sans-serif}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:36px 20px}
.empty .eico{width:72px;height:72px;border-radius:22px;background:var(--chip-bg);color:var(--chip-tx);display:flex;align-items:center;justify-content:center}
.empty h3{font-size:17px}
.empty p{color:var(--muted);max-width:290px}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}

/* filas tipo ajustes */
.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.group>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;min-height:54px;text-decoration:none;background:var(--surface)}
.row small{display:block;color:var(--muted);font-size:12px}
.ricon{width:36px;height:36px;border-radius:10px;background:var(--chip-bg);color:var(--chip-tx);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ricon.red{background:var(--bad-bg);color:var(--bad)}
.unread{width:10px;height:10px;border-radius:50%;background:var(--blue);flex-shrink:0}
.sw{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.row[aria-checked=true] .sw{background:var(--blue)}
.row[aria-checked=true] .sw::after{left:23px}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
summary{font-weight:600;cursor:pointer}
details p{margin-top:8px;color:var(--muted)}

/* barra inferior */
.tabbar[hidden]{display:none}
.tabbar{display:flex;align-items:center;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);height:66px;flex-shrink:0;padding:0 6px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);min-height:50px;text-decoration:none}
.tab.on{color:var(--blue)}
.fab{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#1D4ED8,#4F46E5);color:#fff;margin:-24px 6px 0;box-shadow:0 6px 16px rgba(29,78,216,.45);border:3px solid var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;text-decoration:none}
.actionbar{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line)}

/* hero e intros */
.hero{background:linear-gradient(135deg,#1E2955,#172147 55%,#0F172A);color:#fff;padding:16px 16px 22px;border-radius:0 0 26px 26px}
.brand{display:flex;align-items:center;gap:10px}
.brand small{display:block;color:#B8C7F5;font-size:12px}
.logo{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;color:#FBBF24}
.hero h1{font-size:24px;margin-top:18px}
.hsub{color:#B8C7F5;margin:4px 0 14px}
.fakein{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#E2E8F8;text-decoration:none}
.hbtn{color:#fff;position:relative}
.hbtn:hover{background:rgba(255,255,255,.12)}
.badge{position:absolute;top:3px;right:3px;min-width:18px;height:18px;border-radius:9px;background:#F59E0B;color:#111827;font:700 12px/18px Inter,sans-serif;text-align:center;padding:0 4px;font-style:normal}
.splash,.authtop{color:#fff;background:linear-gradient(160deg,#1E2955,#172147 55%,#0B1120)}
.splash{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px}
.splash h1{font-size:28px}
.splash p{color:#B8C7F5}
.logo-big{width:92px;height:92px;border-radius:28px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;color:#FBBF24;margin-bottom:10px}
.authtop{padding:28px 20px 30px;border-radius:0 0 26px 26px}
.authtop h1{font-size:23px;margin-top:14px}
.authtop p{color:#B8C7F5;margin-top:4px}
.onb{min-height:100%;display:flex;flex-direction:column;gap:14px;padding:20px}
.onbart{width:150px;height:150px;border-radius:40px;margin:20px auto 10px;background:linear-gradient(145deg,#1E2955,#2B3A7A);color:#FBBF24;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.onb h1{font-size:24px;text-align:center}
.onb .lead{text-align:center}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:8px;height:8px;border-radius:8px;background:var(--line)}
.dots i.on{width:24px;background:var(--blue)}
.steps{display:flex;gap:6px;margin:6px 0 16px;padding:0;list-style:none}
.steps li{flex:1;height:6px;border-radius:6px;background:var(--line)}
.steps li.on{background:var(--blue)}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 16px;border:2px dashed var(--line);border-radius:18px;background:var(--surface);text-align:center;cursor:pointer}
.drop:focus-within{outline:2px solid var(--blue);outline-offset:2px}
.paper{background:#fff;color:#111827;border-radius:6px;box-shadow:var(--shadow);padding:24px 22px;min-height:440px;border:1px solid var(--line);font-family:Georgia,"Times New Roman",serif;line-height:1.6}
.paper pre{white-space:pre-wrap;font:inherit;margin:0}
.paper h4{font-family:Georgia,serif;font-size:1.1em;margin-bottom:12px}
.skl{height:10px;border-radius:6px;background:#E5E7EB;margin:12px 0}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin-bottom:6px}
.podium .card{text-align:center;padding:12px 6px}
.podium .avatar{margin:0 auto 6px}
.podium b{display:block;font-size:13px}

/* hojas y avisos */
.backdrop{position:absolute;inset:0;background:rgba(2,6,23,.55);z-index:30;display:flex;align-items:flex-end;animation:fade .15s}
.sheet{width:100%;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 16px 22px;animation:up .2s ease-out}
.sheet h3{font-size:17px;margin-bottom:12px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 14px}
.toast{position:absolute;left:12px;right:12px;top:12px;z-index:50;background:#0F172A;color:#F8FAFC;border:1px solid #334155;border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;transform:translateY(-130%);opacity:0;transition:transform .25s,opacity .25s;pointer-events:none;font-size:13px}
.toast.show{transform:none;opacity:1}
.toast .tok{width:26px;height:26px;border-radius:50%;background:rgba(16,185,129,.2);color:#34D399;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tdesc{color:#A8B3C7;font-size:12px}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <main class="screen" id="screen"></main>
    <nav class="tabbar" id="tabbar" aria-label="Navegación principal" hidden></nav>
    <div id="sheets"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="repo-api.js"></script>
<script src="local-api.js"></script>

const today=()=>new Date().toISOString().slice(0,10);
const first=n=>String(n||'').trim().split(/\s+/)[0]||'';
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const enc=encodeURIComponent;
const tcls=t=>'t-'+norm(t);
const fv=(f,n)=>f.querySelector('[name="'+n+'"]');

const IC={

trophy:'M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H4v1a3 3 0 0 0 3 3M16 6h4v1a3 3 0 0 1-3 3M12 13v4M8 20h8',
help:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.8.5-1.1 1-1.1 1.8M12 17h.01',

function save(){

/* ============ helpers de dominio ============ */
const byId=id=>S.materials.find(m=>m.id===+id);
const who=m=>m.mine?S.user.name:m.uploader;
const pct=m=>{const t=m.up+m.down;return t?Math.round(m.up*100/t):0};
const myPosts=()=>S.materials.filter(m=>m.mine);
const myPts=()=>{const p=myPosts();return p.length*10+p.reduce((a,m)=>a+m.up,0)};
const levelOf=p=>{let l=LEVELS[0];LEVELS.forEach(x=>{if(p>=x.min)l=x});return l};
const countBy=(arr,k)=>{const o={};arr.forEach(x=>o[x[k]]=(o[x[k]]||0)+1);return Object.entries(o).sort((a,b)=>b[1]-a[1])};
function careerOpts(sede,sel,ph){
  const list=sede?ACAD[sede]:(ph==='Todas'?ALLC:[]);
  return '<option value="">'+(sede||ph==='Todas'?esc(ph):'Elegí primero la sede')+'</option>'+list.map(c=>'<option'+(c===sel?' selected':'')+' value="'+esc(c)+'">'+esc(c)+'</option>').join('');
}
function filtered(){
  const q=norm(U.q.trim()),f=U.f;
  const l=S.materials.filter(m=>(!f.sede||m.sede===f.sede)&&(!f.career||m.career===f.career)&&(!f.year||m.year===+f.year)&&(!f.type||m.type===f.type)&&(!f.format||m.format===f.format)&&(!q||norm([m.title,m.subject,m.career,m.type,m.tags.join(' '),who(m)].join(' ')).includes(q)));
  const s={rel:(a,b)=>b.up-a.up||pct(b)-pct(a),new:(a,b)=>b.date.localeCompare(a.date),dl:(a,b)=>b.dl-a.dl}[f.sort]||(()=>0);
  return l.sort(s);
}

  const rel=S.materials.filter(x=>x.subject===m.subject&&x.id!==m.id).slice(0,3);

   '<div class="stats s4"><div class="stat"><b>'+pct(m)+'%</b><span>útil</span></div><div class="stat"><b>'+m.dl+'</b><span>descargas</span></div><div class="stat"><b>'+m.pages+'</b><span>páginas</span></div><div class="stat"><b>'+fdate(m.date).slice(0,5)+'</b><span>'+m.date.slice(0,4)+'</span></div></div>'+
   '<div class="card between"><div style="display:flex;gap:12px;align-items:center"><span class="avatar">'+initials(who(m))+'</span><div><b>'+esc(who(m))+'</b><p class="muted">Subió este material el '+fdate(m.date)+'</p></div></div><span class="chip amber">'+lv.n+'</span></div>'+
   '<div><h3 style="font-size:15px;margin-bottom:6px">Descripción</h3><p style="color:var(--muted);line-height:1.55">'+esc(m.desc)+'</p><div class="chips" style="margin-top:10px">'+m.tags.map(t=>'<span class="chip">'+esc(t)+'</span>').join('')+'</div></div>'+
   '<div><h3 style="font-size:15px;margin-bottom:6px">Vista previa</h3><div class="card" style="background:var(--surface2)"><pre style="white-space:pre-wrap;font:12px/1.55 Inter,sans-serif;margin:0;max-height:150px;overflow:hidden">'+esc(m.preview)+'</pre></div></div>'+
   '<div class="card"><b>¿Te sirvió este material?</b><div class="grid2" style="margin-top:10px"><button class="btn '+(v===1?'btn-primary':'btn-line')+'" data-act="vote" data-arg="'+m.id+'|1" aria-pressed="'+(v===1)+'">'+ic('up',18)+'Útil ('+m.up+')</button><button class="btn '+(v===-1?'btn-danger':'btn-line')+'" data-act="vote" data-arg="'+m.id+'|-1" aria-pressed="'+(v===-1)+'">'+ic('down',18)+'No útil ('+m.down+')</button></div><p class="hint">Podés cambiar tu voto cuando quieras. Cuenta uno solo por persona.</p></div>'+
   '<div class="group"><a class="row" href="#/comments/'+m.id+'"><span class="ricon">'+ic('comment',20)+'</span><span class="grow"><b>Comentarios</b><small>'+nc+' comentario'+(nc===1?'':'s')+'</small></span>'+ic('chev',18)+'</a><button class="row" data-act="openReport" data-arg="'+m.id+'"><span class="ricon red">'+ic('flag',20)+'</span><span class="grow"><b>Reportar material</b><small>Contenido incorrecto, dañado o sin permiso</small></span>'+ic('chev',18)+'</button></div>'+
   (rel.length?'<div><h3 style="font-size:15px;margin-bottom:10px">Más de esta materia</h3><div class="list">'+rel.map(card).join('')+'</div></div>':'')+
   '</div></div><div class="actionbar"><a class="btn btn-primary grow" href="#/viewer/'+m.id+'">'+ic('eye',20)+'Ver documento</a><button class="btn btn-soft" data-act="download" data-arg="'+m.id+'">'+ic('download',20)+'Descargar</button></div>',
   after(){if(S.recent[0]!==m.id){S.recent=[m.id].concat(S.recent.filter(x=>x!==m.id)).slice(0,6);save()}}};

IC.eye='M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zm10 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6z';
function vViewer([id]){
  const m=byId(id);if(!m)return notFound();
  if(U.vid!==m.id){U.vid=m.id;U.page=1;U.zoom=1}
  const p=U.page,fs=(13*U.zoom).toFixed(1);
  const body=p===1?'<h4>'+esc(m.title)+'</h4><pre>'+esc(m.preview)+'</pre>':'<h4>Página '+p+'</h4>'+[90,100,72,96,60,100,84].map(w=>'<div class="skl" style="width:'+w+'%"></div>').join('')+'<p style="font-size:.8em;color:#6B7280;margin-top:18px">Vista simulada: en la versión final acá se muestra el contenido real del archivo.</p>';
  return{html:appbar(m.title,'<button class="iconbtn" data-act="zoom" data-arg="-1" aria-label="Reducir texto"><b>A-</b></button><button class="iconbtn" data-act="zoom" data-arg="1" aria-label="Agrandar texto"><b>A+</b></button>')+
   '<div class="pad"><div class="paper" style="font-size:'+fs+'px">'+body+'</div></div>'+
   '<div class="actionbar" style="align-items:center"><button class="iconbtn" data-act="page" data-arg="-1" aria-label="Página anterior" '+(p<=1?'disabled style="opacity:.4"':'')+'>'+ic('back',22)+'</button><span class="grow center" style="font-weight:600">Página '+p+' de '+m.pages+'</span><button class="iconbtn" data-act="page" data-arg="1" aria-label="Página siguiente" '+(p>=m.pages?'disabled style="opacity:.4"':'')+'>'+ic('chev',22)+'</button><button class="btn btn-primary sm" data-act="download" data-arg="'+m.id+'">Descargar</button></div>'};
}
function vComments([id]){
  const m=byId(id);if(!m)return notFound();

  return{html:appbar('Comentarios')+'<div class="pad"><p class="muted" style="margin-bottom:12px">'+esc(m.title)+'</p>'+
   (l.length?'<div class="list">'+l.map(c=>'<div class="card" style="display:flex;gap:10px"><span class="avatar">'+initials(c.who)+'</span><div class="grow"><div class="between"><b>'+esc(c.who)+'</b><span class="muted">'+fdate(c.d)+'</span></div><p style="margin-top:4px">'+esc(c.t)+'</p></div></div>').join('')+'</div>':empty('comment','Todavía no hay comentarios','Preguntá o aclará algo sobre este material. Ayuda a quien lo use después.'))+'</div>'+

}

/* ============ pantallas: subir ============ */
function vUpload([step]){
  U.draft=U.draft||newDraft();const d=U.draft;
  if(step==='done'){
    const m=byId(U.lastId);
    return{html:'<div class="pad">'+empty('check','¡Material publicado!','Ya está disponible para todos. Compartilo con tus compañeros para que lo usen.',
     (m?'<a class="btn btn-primary btn-block" href="#/doc/'+m.id+'">Ver mi aporte</a><button class="btn btn-soft btn-block" data-act="openShare" data-arg="'+m.id+'">'+ic('share',18)+'Compartir</button>':'')+'<a class="btn btn-line btn-block" href="#/upload/1">Subir otro material</a><a class="link" href="#/home">Volver al inicio</a>')+'</div>'};
  }
  const n=Math.min(Math.max(+step||1,1),3);
  const head=appbar('Subir material','',true)+'<div class="pad"><p class="muted" style="margin-bottom:6px">Paso '+n+' de 3</p><ol class="steps" aria-hidden="true">'+[1,2,3].map(k=>'<li class="'+(k<=n?'on':'')+'"></li>').join('')+'</ol>';
  if(n===1){
    return{html:head+'<div class="form"><label class="drop" for="fileIn">'+ic('upload',36)+'<b>Elegí un archivo</b><span class="muted">PDF, Word, PowerPoint o imagen. Hasta 20 MB.</span></label><input class="vh" id="fileIn" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png">'+
     (d.file?'<div class="card" style="display:flex;gap:12px;align-items:center"><span class="ricon">'+ic('file',20)+'</span><div class="grow"><b style="word-break:break-all">'+esc(d.file.name)+'</b><p class="muted">'+esc(d.file.ext)+', '+esc(d.file.size)+'</p></div><button class="iconbtn sm" data-act="removeFile" aria-label="Quitar archivo">'+ic('close',20)+'</button></div>':'')+
     '<div class="err" id="err" role="alert"></div><a class="btn btn-primary btn-block '+(d.file?'':'')+'" href="#/upload/2" data-act="needFile">Continuar</a></div></div>'};
  }
  if(n===2){
    return{html:head+'<form class="form" data-form="upload2" novalidate>'+
     '<label class="field"><span>Título</span><input class="input" data-in="draft:title" value="'+esc(d.title)+'" placeholder="Ej: Resumen parcial 2, unidades 3 y 4" maxlength="90"></label>'+
     '<label class="field"><span>Sede</span><select class="select" data-in="draft:sede" data-dep="dCareer"><option value="">Elegí la sede</option>'+SEDES.map(s=>'<option'+(d.sede===s?' selected':'')+'>'+s+'</option>').join('')+'</select></label>'+
     '<label class="field"><span>Carrera</span><select class="select" id="dCareer" data-in="draft:career">'+careerOpts(d.sede,d.career,'Elegí la carrera')+'</select></label>'+
     '<div class="grid2"><label class="field"><span>Año</span><select class="select" data-in="draft:year"><option value="">Año</option>'+[1,2,3,4,5].map(y=>'<option value="'+y+'"'+(+d.year===y?' selected':'')+'>'+y+'°</option>').join('')+'</select></label>'+
     '<label class="field"><span>Tipo</span><select class="select" data-in="draft:type"><option value="">Tipo</option>'+TYPES.map(t=>'<option'+(d.type===t?' selected':'')+'>'+t+'</option>').join('')+'</select></label></div>'+
     '<label class="field"><span>Materia</span><input class="input" data-in="draft:subject" value="'+esc(d.subject)+'" placeholder="Ej: Desarrollo de Aplicaciones Web" list="subjects"><datalist id="subjects">'+countBy(S.materials,'subject').map(([s])=>'<option value="'+esc(s)+'">').join('')+'</datalist></label>'+
     '<label class="field"><span>Descripción (opcional)</span><textarea class="textarea" data-in="draft:desc" maxlength="300" placeholder="Qué unidades incluye, de qué año es, si está resuelto">'+esc(d.desc)+'</textarea></label>'+
     '<label class="field"><span>Etiquetas (opcional)</span><input class="input" data-in="draft:tags" value="'+esc(d.tags)+'" placeholder="Separadas por coma: sql, joins, parcial"></label>'+
     '<div class="err" id="err" role="alert"></div><button class="btn btn-primary btn-block" type="submit">Revisar publicación</button></form></div>'};
  }
  return{html:head+'<div class="form"><div class="card doc '+tcls(d.type||'Apunte')+'"><span class="chip" style="align-self:flex-start">'+esc(d.type||'Material')+' en '+esc(d.file?d.file.ext:'PDF')+'</span><h3 style="font-size:17px;margin-top:4px">'+esc(d.title)+'</h3><p class="dsub">'+esc(d.subject)+'</p><p class="muted">'+esc(d.sede)+', '+esc(d.career)+', '+esc(d.year)+'° año</p>'+(d.desc?'<p style="margin-top:6px;color:var(--muted)">'+esc(d.desc)+'</p>':'')+'<p class="muted" style="margin-top:6px">Archivo: '+esc(d.file?d.file.name:'sin archivo')+'</p></div>'+
   '<label class="check"><input type="checkbox" data-in="draft:confirm"'+(d.confirm?' checked':'')+'><span>Confirmo que el material es mío o que tengo permiso para compartirlo.</span></label><div class="err" id="err" role="alert"></div>'+
   '<div id="pubArea"><button class="btn btn-primary btn-block" data-act="publish">Publicar material</button></div><a class="btn btn-line btn-block" href="#/upload/2">Volver a editar</a></div></div>'};
}

function vSaved(){

  const cols=S.collections.map(c=>({c,n:list.filter(m=>S.saved[m.id]===c.id).length}));

function vCollection([id]){
  const c=S.collections.find(x=>x.id===id);if(!c)return notFound();
  const list=S.materials.filter(m=>S.saved[m.id]===id);
  return{tabs:true,html:appbar(c.name,id==='gen'?'':'<button class="iconbtn" data-act="deleteCol" data-arg="'+id+'" aria-label="Eliminar colección">'+ic('trash',22)+'</button>')+'<div class="pad">'+

}

const ROUTES={splash:vSplash,onb:vOnb,login:vLogin,register:vRegister,forgot:vForgot,home:vHome,explore:vExplore,subject:vSubject,doc:vDoc,viewer:vViewer,comments:vComments,upload:vUpload,saved:vSaved,collection:vCollection,profile:vProfile,editprofile:vEditProfile,mine:vMine,downloads:vDownloads,notifs:vNotifs,ranking:vRanking,settings:vSettings,help:vHelp};
const PUBLIC=['splash','onb','login','register','forgot'];
let seq=0;
function parse(){const h=location.hash.replace(/^#\/?/,'');const [r,...p]=h.split('/');let ps=p;try{ps=p.map(decodeURIComponent)}catch(e){}return{r:r||'',p:ps}}
function go(p){const h='#/'+p;const s=seq;if(location.hash===h){render();return}location.hash=h;setTimeout(()=>{if(seq===s)render()},40)}
function render(keep){
  seq++;clearInterval(U.timer);
  let {r,p}=parse();
  if(r!=='forgot')U.forgotSent=false;
  if(!ROUTES[r])r=S.user?'home':'splash';
  if(!PUBLIC.includes(r)&&!S.user){r='login';p=[];history.replaceState(null,'','#/login')}
  if(S.user&&['login','register','forgot'].includes(r)){r='home';p=[];history.replaceState(null,'','#/home')}
  if(r!=='upload'&&U.draft&&!U.draft.file&&!U.draft.title)U.draft=null;
  const scr=$('#screen'),top=scr.scrollTop;
  const v=ROUTES[r](p);
  scr.innerHTML=v.html;
  const tb=$('#tabbar');
  if(v.tabs){tb.hidden=false;tb.innerHTML=tabsHTML(r)}else{tb.hidden=true;tb.innerHTML=''}
  scr.scrollTop=keep?top:0;
  if(v.after)v.after();
}
function applyTheme(){
  const el=document.documentElement;
  if(S.theme==='auto')el.removeAttribute('data-theme');else el.setAttribute('data-theme',S.theme);
}

function finishUploadOld(){
  const d=U.draft,id=Math.max(0,...S.materials.map(m=>m.id))+1;
  const m={id,title:d.title.trim(),subject:d.subject.trim(),sede:d.sede,career:d.career,year:+d.year||1,type:d.type,format:d.file.ext,uploader:S.user.name,date:today(),up:0,down:0,dl:0,
    pages:d.file.pages||Math.max(1,Math.round((d.file.bytes||200000)/90000)),desc:d.desc.trim()||'Material compartido por un estudiante de la UCA.',
    preview:d.file.demo?'Contenido de ejemplo del documento.':'Archivo: '+d.file.name+'\n\nLa vista previa completa se genera cuando se procesa el archivo.',
    tags:(d.tags||'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,5),mine:true};
  S.materials.unshift(m);if(d.file.url)FILES[id]=d.file;U.lastId=id;U.draft=null;save();go('upload/done');
}
function pickFile(inp){
  const f=inp.files[0];if(!f)return;const err=$('#err');
  const ext=f.name.split('.').pop().toLowerCase(),map={pdf:'PDF',doc:'DOCX',docx:'DOCX',ppt:'PPTX',pptx:'PPTX',jpg:'IMG',jpeg:'IMG',png:'IMG'};
  if(!map[ext]){err.textContent='Ese formato no está permitido. Subí un PDF, Word, PowerPoint o imagen.';inp.value='';return}
  if(f.size>20*1024*1024){err.textContent='El archivo pesa más de 20 MB. Comprimilo e intentá de nuevo.';inp.value='';return}
  const size=f.size>1048576?(f.size/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(f.size/1024))+' KB';
  U.draft.file={name:f.name,ext:map[ext],size,bytes:f.size};
  const rd=new FileReader();rd.onload=e=>{if(U.draft&&U.draft.file)U.draft.file.url=e.target.result};rd.readAsDataURL(f);
  render(true);
}

const FORMS={
  login(f){
    const e=fv(f,'email').value.trim(),p=fv(f,'password').value,err=$('#err');
    if(!/^\S+@\S+\.\S+$/.test(e)){err.textContent='Ingresá un correo válido, por ejemplo nombre@uca.edu.ar.';fv(f,'email').focus();return}
    if(p.length<6){err.textContent='La contraseña tiene que tener al menos 6 caracteres.';fv(f,'password').focus();return}
    const name=e.split('@')[0].replace(/[._-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    S.user=S.accounts[e]||Object.assign(defaultUser(),{email:e,name});S.onboarded=true;save();go('home');toast('¡Hola de nuevo!','Ingresaste correctamente.');
  },
  register(f){
    const err=$('#err'),r=U.reg,name=fv(f,'name').value.trim(),e=fv(f,'email').value.trim();
    if(name.length<2){err.textContent='Escribí tu nombre y apellido.';fv(f,'name').focus();return}
    if(!/^\S+@\S+\.\S+$/.test(e)){err.textContent='Ingresá un correo válido.';fv(f,'email').focus();return}
    if(fv(f,'password').value.length<6){err.textContent='La contraseña tiene que tener al menos 6 caracteres.';fv(f,'password').focus();return}
    if(!r.sede||!r.career||!r.year){err.textContent='Elegí tu sede, tu carrera y el año de cursada.';return}
    if(!fv(f,'terms').checked){err.textContent='Tenés que aceptar los términos para crear la cuenta.';return}
    S.user={name,email:e,sede:r.sede,career:r.career,year:+r.year};S.accounts[e]=S.user;S.onboarded=true;U.reg={sede:'',career:'',year:''};save();go('home');toast('Cuenta creada','Ya podés explorar y subir material.');
  },
  forgot(f){const e=fv(f,'email').value.trim();if(!/^\S+@\S+\.\S+$/.test(e)){$('#err').textContent='Ingresá un correo válido.';return}U.forgotEmail=e;U.forgotSent=true;render()},
  comment(f){const t=fv(f,'t').value.trim();if(!t)return;const id=+f.dataset.id;(S.comments[id]=S.comments[id]||[]).push({who:S.user.name,t,d:today()});save();render(true);toast('Comentario publicado')},
  upload2(f){
    const d=U.draft,err=$('#err');
    if(d.title.trim().length<5){err.textContent='El título tiene que tener al menos 5 caracteres.';return}
    if(!d.sede||!d.career){err.textContent='Elegí la sede y la carrera.';return}
    if(!d.year||!d.type){err.textContent='Elegí el año y el tipo de material.';return}
    if(d.subject.trim().length<2){err.textContent='Escribí el nombre de la materia.';return}
    go('upload/3');
  },
  editprofile(f){
    const e=U.edit,name=fv(f,'name').value.trim(),mail=fv(f,'email').value.trim(),err=$('#err');
    if(name.length<2){err.textContent='Escribí tu nombre y apellido.';return}
    if(!/^\S+@\S+\.\S+$/.test(mail)){err.textContent='Ingresá un correo válido.';return}
    if(!e.career){err.textContent='Elegí tu carrera.';return}
    S.user=Object.assign({},e,{name,email:mail,year:+e.year});S.accounts[mail]=S.user;U.edit=null;save();toast('Perfil actualizado');go('profile');
  },
  report(f){
    const r=f.querySelector('input[name=reason]:checked');if(!r){$('#err').textContent='Elegí un motivo para enviar el reporte.';return}
    closeSheet();toast('Reporte enviado','Lo revisamos en las próximas 48 horas.');
  },
  savecol(f){const id=+f.dataset.id,c=f.querySelector('input[name=col]:checked');if(!c)return;S.saved[id]=c.value;save();closeSheet();U.pendingDoc=null;toast('Guardado','En '+S.collections.find(x=>x.id===c.value).name+'.');render(true)},
  newcol(f){
    const n=fv(f,'name').value.trim(),err=$('#err');
    if(n.length<2){err.textContent='Ponele un nombre a la colección.';return}
    if(S.collections.some(c=>norm(c.name)===norm(n))){err.textContent='Ya tenés una colección con ese nombre.';return}
    S.collections.push({id:'c'+Date.now(),name:n});save();toast('Colección creada',n);
    if(U.pendingDoc&&parse().r==='doc'){openSave(U.pendingDoc)}else{closeSheet();render(true)}
  }
};
function setIn(el){
  const [ns,key]=el.dataset.in.split(':');
  const t={draft:U.draft,reg:U.reg,edit:U.edit,f:U.f,u:U}[ns];if(!t)return;
  t[key]=el.type==='checkbox'?el.checked:el.value;
  if(el.dataset.dep){t.career='';const d=$('#'+el.dataset.dep);if(d)d.innerHTML=careerOpts(el.value,'',ns==='f'?'Todas':'Elegí tu carrera')}
  if(ns==='f'||ns==='u')refreshExplore();
}

/* ============ conexión con Supabase ============ */
const CFG=window.APP_CONFIG||{};
/* Si config.js tiene los datos de Supabase, todo se comparte online. Si no, la app funciona solo en este dispositivo. */
const REMOTE=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_KEY&&!/TU-PROYECTO|PEGA-ACA/.test(CFG.SUPABASE_URL+CFG.SUPABASE_KEY)&&window.supabase&&window.createRepoApi);
const sb=REMOTE?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}):null;
const repo=REMOTE?window.createRepoApi(sb):window.createLocalApi();
async function api(method,path,body){
  try{return await repo.api(method,path,body)}
  catch(e){if(e.status===401&&TOKEN&&path!=='/api/login'){dropSession();location.hash='#/login'}throw e}
}
function dropSession(){
  stopRealtime();
  TOKEN=null;try{localStorage.removeItem(KEY+':token')}catch(e){}
  Object.assign(S,{user:null,materials:[],comments:{},rank:[],votes:{},notifs:[],saved:{},downloads:[],recent:[],collections:[{id:'gen',name:'General'}]});
}
/* full=true: también trae los datos personales (guardados, colecciones...). Con false solo actualiza lo compartido,
   para no pisar un cambio tuyo que todavía se está guardando. */
function applyBoot(d,full){
  S.user=d.user;S.materials=d.materials;S.comments=d.comments||{};S.rank=d.rank||[];S.votes=d.votes||{};S.notifs=d.notifs||[];
  if(!full)return;
  const u=d.data||{};
  S.saved=u.saved||{};S.collections=u.collections&&u.collections.length?u.collections:[{id:'gen',name:'General'}];
  S.downloads=u.downloads||[];S.recent=u.recent||[];S.prefs=Object.assign(S.prefs,u.prefs||{});
}
async function refresh(full){applyBoot(await api('GET','/api/bootstrap'),!!full)}
async function startSession(d){TOKEN='sb';S.onboarded=true;saveLocal();await refresh(true);startRealtime()}

/* En la app de Android el WebView no baja archivos solo: con base de datos se abre el enlace en el navegador del celu,
   y sin base de datos se guarda el archivo y se abre el menú de compartir (Guardar en Archivos, Drive, abrir con...). */
async function nativeSave(f){
  const P=window.Capacitor.Plugins;
  if(REMOTE){await P.Browser.open({url:f.url});return}
  const blob=await (await fetch(f.url)).blob();
  const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('No se pudo leer el archivo'));r.readAsDataURL(blob)});
  const name=String(f.name||'apunte').replace(/[\\/:*?"<>|]+/g,'_');
  const w=await P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});
  await P.Share.share({title:name,files:[w.uri],dialogTitle:'Guardar o abrir el apunte'});
}

/* ---- tiempo real: cuando alguien sube, vota o comenta, se actualiza solo ---- */
let RT=null,rtT=null;
function startRealtime(){
  if(!sb||RT)return;
  const bump=()=>{clearTimeout(rtT);rtT=setTimeout(softRefresh,500)};
  try{
    RT=sb.channel('repo-live');
    ['materials','comments','notifications'].forEach(t=>RT.on('postgres_changes',{event:'*',schema:'public',table:t},bump));
    RT.subscribe();
  }catch(e){RT=null}
}
function stopRealtime(){clearTimeout(rtT);if(RT&&sb){try{sb.removeChannel(RT)}catch(e){}}RT=null}
async function softRefresh(){
  if(!TOKEN||!S.user)return;
  try{await refresh(false)}catch(e){return}
  const ae=document.activeElement,typing=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  if(typing||$('#sheets').innerHTML.trim()||['upload','register','login','forgot','editprofile','splash','onb'].includes(parse().r))return;
  render(true);
}
const setErr=m=>{const e=$('#err');if(e)e.textContent=m};

Object.assign(A,{
  sso(){toast('Acceso con cuenta UCA','Lo tiene que habilitar la universidad. Por ahora ingresá con tu correo.')},
  async logout(){try{await api('POST','/api/logout')}catch(e){}dropSession();closeSheet();U.edit=null;U.draft=null;go('login');toast('Sesión cerrada','Hasta la próxima.')},
  async vote(a){
    const [id,v]=a.split('|');
    try{const r=await api('POST','/api/materials/'+id+'/vote',{v:+v});await refresh();render(true);toast(r.vote===0?'Voto quitado':'Gracias por tu voto')}
    catch(e){toast('No se pudo votar',e.message)}
  },
  async download(id){
    const m=byId(id);if(!m)return;
    try{await api('POST','/api/materials/'+m.id+'/download')}catch(e){toast('No se pudo descargar',e.message);return}
    S.downloads=S.downloads.filter(x=>x.id!==m.id);S.downloads.unshift({id:m.id,date:today()});m.dl++;save();
    if(!m._file){toast('Sin archivo','Este material no tiene un archivo adjunto.');return}
    let f=null;try{f=await repo.fileUrl(m)}catch(e){}
    if(!f){toast('No se encontró el archivo','Puede que haya sido eliminado.');return}
    if(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()){
      try{await nativeSave(f)}catch(e){toast('No se pudo guardar el archivo',e.message||'Probá de nuevo.');return}
      toast(REMOTE?'Abriendo la descarga':'Elegí dónde guardarlo',REMOTE?'Se baja desde el navegador del celular.':'Guardalo en Archivos o abrilo con otra app.');
      return;
    }
    const a=document.createElement('a');a.href=f.url;a.download=f.name||'apunte';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
    if(f.revoke)setTimeout(f.revoke,15000);
    toast('Descarga iniciada','Quedó en tu carpeta de descargas.');
  },
  async delMine(id){
    try{await api('DELETE','/api/materials/'+id);await refresh();toast('Aporte eliminado');render(true)}
    catch(e){toast('No se pudo eliminar',e.message)}
  },
  markRead(id){const n=S.notifs.find(x=>x.id===+id);if(n&&!n.read){n.read=true;api('POST','/api/notifs/read',{id:+id}).catch(()=>{})}},
  markAll(){S.notifs.forEach(n=>n.read=true);api('POST','/api/notifs/read',{all:true}).catch(()=>{});render(true)}
});

Object.assign(FORMS,{
  async login(f){
    const e=fv(f,'email').value.trim(),p=fv(f,'password').value;
    if(!/^\S+@\S+\.\S+$/.test(e)){setErr('Ingresá un correo válido, por ejemplo nombre@uca.edu.ar.');fv(f,'email').focus();return}
    if(p.length<6){setErr('La contraseña tiene que tener al menos 6 caracteres.');fv(f,'password').focus();return}
    try{await startSession(await api('POST','/api/login',{email:e,password:p}));go('home');toast('¡Hola de nuevo!','Ingresaste correctamente.')}
    catch(x){setErr(x.message)}
  },
  async register(f){
    const r=U.reg,name=fv(f,'name').value.trim(),e=fv(f,'email').value.trim(),pw=fv(f,'password').value;
    if(name.length<2){setErr('Escribí tu nombre y apellido.');fv(f,'name').focus();return}
    if(!/^\S+@\S+\.\S+$/.test(e)){setErr('Ingresá un correo válido.');fv(f,'email').focus();return}
    if(pw.length<6){setErr('La contraseña tiene que tener al menos 6 caracteres.');fv(f,'password').focus();return}
    if(!r.sede||!r.career||!r.year){setErr('Elegí tu sede, tu carrera y el año de cursada.');return}
    if(!fv(f,'terms').checked){setErr('Tenés que aceptar los términos para crear la cuenta.');return}
    try{await startSession(await api('POST','/api/register',{name,email:e,password:pw,sede:r.sede,career:r.career,year:+r.year}));U.reg={sede:'',career:'',year:''};go('home');toast('Cuenta creada','Ya podés explorar y subir material.')}
    catch(x){setErr(x.message)}
  },
  async comment(f){
    const t=fv(f,'t').value.trim();if(!t)return;const id=+f.dataset.id;
    try{const c=await api('POST','/api/materials/'+id+'/comments',{t});(S.comments[id]=S.comments[id]||[]).push(c);render(true);toast('Comentario publicado')}
    catch(e){toast('No se pudo comentar',e.message)}
  },
  async editprofile(f){
    const e=U.edit,name=fv(f,'name').value.trim();
    if(name.length<2){setErr('Escribí tu nombre y apellido.');return}
    if(!e.career){setErr('Elegí tu carrera.');return}
    try{await api('PUT','/api/me',{name,sede:e.sede,career:e.career,year:+e.year});await refresh();U.edit=null;toast('Perfil actualizado');go('profile')}
    catch(x){setErr(x.message)}
  },
  async report(f){
    const r=f.querySelector('input[name=reason]:checked');if(!r){setErr('Elegí un motivo para enviar el reporte.');return}
    const det=fv(f,'detail');
    try{await api('POST','/api/materials/'+f.dataset.id+'/report',{reason:r.value,detail:det?det.value:''});closeSheet();toast('Reporte enviado','Lo revisa quien administre el repositorio.')}
    catch(x){setErr(x.message)}
  }
});

async function finishUpload(){
  const d=U.draft,f=d.file;
  try{
    for(let i=0;i<40&&!f.demo&&!f.url;i++)await new Promise(r=>setTimeout(r,100));
    const m=await api('POST','/api/materials',{title:d.title.trim(),subject:d.subject.trim(),sede:d.sede,career:d.career,year:+d.year,type:d.type,desc:d.desc.trim(),
      tags:(d.tags||'').split(',').map(x=>x.trim()).filter(Boolean).slice(0,5),file:{name:f.name,ext:f.ext,bytes:f.bytes,pages:f.pages,demo:!!f.demo,data:f.url||null}});
    await refresh();U.lastId=m.id;U.draft=null;go('upload/done');
  }catch(e){toast('No se pudo publicar',e.message);render(true)}
}
